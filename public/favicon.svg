<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 背景 -->
  <rect width="32" height="32" rx="4" fill="#050a0f"/>

  <!-- 中央分割ライン -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="#00ffe7" stroke-width="0.5" opacity="0.4"/>

  <!-- 左半分：脳（有機的な曲線） -->
  <path
    d="M16 8
       C13 8, 10 9, 9 11
       C7 12, 6 14, 7 16
       C6 18, 7 20, 9 21
       C10 23, 13 24, 16 24"
    fill="none" stroke="#00ffe7" stroke-width="1.2" stroke-linecap="round"/>
  <!-- 脳の内部しわ -->
  <path d="M16 12 C13 12, 11 13, 11 15" fill="none" stroke="#00ffe7" stroke-width="0.7" opacity="0.6" stroke-linecap="round"/>
  <path d="M16 17 C13 17, 11 18, 12 20" fill="none" stroke="#00ffe7" stroke-width="0.7" opacity="0.6" stroke-linecap="round"/>

  <!-- 右半分：ICチップ -->
  <!-- チップ本体 -->
  <rect x="18" y="10" width="10" height="12" rx="1" fill="none" stroke="#00ffe7" stroke-width="1"/>
  <!-- チップ内グリッド -->
  <rect x="20" y="12" width="2" height="2" rx="0.3" fill="#00ffe7" opacity="0.7"/>
  <rect x="23" y="12" width="2" height="2" rx="0.3" fill="#00ffe7" opacity="0.7"/>
  <rect x="20" y="15" width="2" height="2" rx="0.3" fill="#00ffe7" opacity="0.4"/>
  <rect x="23" y="15" width="2" height="2" rx="0.3" fill="#00ffe7" opacity="0.7"/>
  <rect x="20" y="18" width="2" height="2" rx="0.3" fill="#00ffe7" opacity="0.7"/>
  <rect x="23" y="18" width="2" height="2" rx="0.3" fill="#00ffe7" opacity="0.4"/>
  <!-- チップピン（上下） -->
  <line x1="20" y1="10" x2="20" y2="8"  stroke="#00ffe7" stroke-width="0.8"/>
  <line x1="23" y1="10" x2="23" y2="8"  stroke="#00ffe7" stroke-width="0.8"/>
  <line x1="20" y1="22" x2="20" y2="24" stroke="#00ffe7" stroke-width="0.8"/>
  <line x1="23" y1="22" x2="23" y2="24" stroke="#00ffe7" stroke-width="0.8"/>
  <!-- チップピン（左） -->
  <line x1="18" y1="13" x2="16" y2="13" stroke="#00ffe7" stroke-width="0.8"/>
  <line x1="18" y1="16" x2="16" y2="16" stroke="#00ffe7" stroke-width="0.8"/>
  <line x1="18" y1="19" x2="16" y2="19" stroke="#00ffe7" stroke-width="0.8"/>
</svg>
